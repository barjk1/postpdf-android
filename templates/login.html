<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233D"><link rel="stylesheet" href="/static/app.css"><title>Giriş • PostPDF</title></head>
<body><main class="login-page"><div class="login-card"><div class="brand"><span class="brand-icon">▧</span>Post<span class="brand-accent">PDF</span></div><h1>Uygulamaya giriş</h1><p>Bu alan kişisel kullanım için erişim koduyla korunuyor.</p><form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="pin">Uygulama erişim kodu</label><input type="password" id="pin" name="pin" autocomplete="current-password" required><button type="submit" class="primary-btn">Giriş yap <span>→</span></button></form>{% if error %}<p class="error-message">{{ error }}</p>{% endif %}</div></main></body></html>
